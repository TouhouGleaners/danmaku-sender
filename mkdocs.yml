site_name: B站弹幕补档工具
site_description: 现代化 Bilibili 弹幕发送、校验与补档工具
site_author: Miku_oso
site_url: https://TouhouGleaners.github.io/danmaku-sender/

# 仓库信息
repo_name: TouhouGleaners/danmaku-sender
repo_url: https://github.com/TouhouGleaners/danmaku-sender
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs   # 顶部横向导航条
    - navigation.top    # 回到顶部按钮
    - content.code.copy # 代码块一键复制按钮
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition

nav:
  - 🏠 首页: index.md

  - 🚀 快速上手:
      - 获取 B 站身份凭证: setup/credentials.md
      - 5 分钟发送第一条弹幕: setup/first_send.md
      - 界面总览与导航: setup/ui-overview.md

  - 📦 核心功能手册:
      - 🎯 弹幕发射器:
          - 任务创建与队列操作: features/sender/create-task.md
          - 频率控制与并发策略: features/sender/delay-control.md
          - 断点续传与智能去重: features/sender/resume.md
      - 🎨 弹幕编辑器:
          - 校验规则与异常标红: features/editor/validation.md
          - 单条编辑与属性检查器: features/editor/inspector.md
          - 批量修复工具: features/editor/batch-tools.md
          - 时间轴平移修正: features/editor/offset.md
      - 📡 弹幕监视器:
          - 实时存活率仪表盘: features/monitor/dashboard.md
          - 弹幕池轮询与丢失排查: features/monitor/verify.md
      - 📜 历史记录管理:
          - 搜索筛选与单条验证: features/history/search.md

  - ⚙️ 配置与数据:
      - 账号与安全 (keyring 加密): config/account.md
      - 全局发送与监视配置: config/settings.md
      - 用户数据目录与存储结构: config/data-storage.md

  - 🔧 进阶与排查:
      - 彩虹弹幕与高级特效包: advanced/canvas.md
      - 错误码速查与故障排查: advanced/troubleshooting.md
      - 🙋 常见问题 (FAQ): faq.md